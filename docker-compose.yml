version: '3.8'

services:
  cropshield-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cropshield_ai_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=CropShield AI
      - PORT=8000
    volumes:
      - cropshield_uploads:/app/uploads
      - cropshield_db:/app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cropshield_uploads:
  cropshield_db:
