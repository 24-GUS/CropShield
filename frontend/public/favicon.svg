<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Emerald to Deep Forest Gradient -->
    <linearGradient id="shieldBg" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Neon Lime Sprout Gradient -->
    <linearGradient id="sproutGrad" x1="18" y1="14" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Shield Border Glow -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield with Glow -->
  <path d="M32 3C44 7.5 53 10.5 57 15C57 33 49 51 32 61C15 51 7 33 7 15C11 10.5 20 7.5 32 3Z" 
        fill="url(#shieldBg)" 
        stroke="#4ade80" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#shieldGlow)"/>

  <!-- Inner Architectural Border -->
  <path d="M32 7.5C41.5 11 49 13.5 52.5 17C52.5 31 46 47 32 55.5C18 47 11.5 31 11.5 17C15 13.5 22.5 11 32 7.5Z" 
        stroke="#22c55e" 
        stroke-width="1.2" 
        stroke-opacity="0.6"
        fill="none"/>

  <!-- Central Botanical Sprout (Left Leaf Half) -->
  <path d="M32 46C32 46 21 41 18 30C15.5 21 21.5 15 32 13C32 24 30 36 32 46Z" 
        fill="url(#sproutGrad)"/>

  <!-- Central Botanical Sprout (Right Leaf Half) -->
  <path d="M32 46C32 46 43 41 46 30C48.5 21 42.5 15 32 13C32 24 34 36 32 46Z" 
        fill="#22c55e" 
        opacity="0.95"/>

  <!-- Leaf Central Spine / Stem -->
  <path d="M32 15V46" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.9"/>

  <!-- AI Neural Circuit Node 1 (Left Branch) -->
  <line x1="25" y1="27" x2="32" y2="31" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <circle cx="25" cy="27" r="2" fill="#ffffff"/>
  <circle cx="25" cy="27" r="1" fill="#15803d"/>

  <!-- AI Neural Circuit Node 2 (Right Branch) -->
  <line x1="39" y1="25" x2="32" y2="29" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <circle cx="39" cy="25" r="2" fill="#ffffff"/>
  <circle cx="39" cy="25" r="1" fill="#15803d"/>

  <!-- AI Apex Beacon Pulse (Top Glowing Node) -->
  <circle cx="32" cy="13" r="3" fill="#bbf7d0"/>
  <circle cx="32" cy="13" r="1.5" fill="#ffffff"/>
</svg>
