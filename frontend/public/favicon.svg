<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shield Background with subtle gradient -->
  <defs>
    <linearGradient id="shieldGrad" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="20" y1="14" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M32 3C44 7 53 10 57 15C57 32 49 51 32 61C15 51 7 32 7 15C11 10 20 7 32 3Z" 
        fill="url(#shieldGrad)" 
        stroke="#4ade80" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Protective Shield Border -->
  <path d="M32 7C42 10.5 49.5 13 53 17C53 30.5 46.5 46.5 32 55.5C17.5 46.5 11 30.5 11 17C14.5 13 22 10.5 32 7Z" 
        stroke="#16a34a" 
        stroke-width="1.2" 
        stroke-opacity="0.6"
        fill="none"/>

  <!-- Agricultural Leaf / Sprout Center Emblem -->
  <!-- Left Leaf Half -->
  <path d="M32 46C32 46 22 41 19 31C16.5 22.5 22 16 32 14C32 24 30 36 32 46Z" 
        fill="url(#leafGrad)"/>

  <!-- Right Leaf Half with slight highlight -->
  <path d="M32 46C32 46 42 41 45 31C47.5 22.5 42 16 32 14C32 24 34 36 32 46Z" 
        fill="#22c55e" 
        opacity="0.9"/>

  <!-- Center Leaf Vein -->
  <path d="M32 16V46" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.8"/>

  <!-- Diagnostic / AI Neural Pulse Nodes -->
  <circle cx="26" cy="27" r="1.6" fill="#ffffff"/>
  <line x1="26" y1="27" x2="32" y2="31" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
  <circle cx="38" cy="25" r="1.6" fill="#ffffff"/>
  <line x1="38" y1="25" x2="32" y2="29" stroke="#ffffff" stroke-width="1" opacity="0.75"/>
  <circle cx="32" cy="14" r="2.2" fill="#86efac"/>
</svg>