services:
  - type: web
    name: cropshield-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: CropShield AI
      - key: SECRET_KEY
        generateValue: true
